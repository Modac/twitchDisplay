; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32 @ 8.0.0
board = esp32-c3-devkitm-1
; same pins as the DevKitM-1 variant, but with a plain LED on GPIO 8 instead of
; the DevKitM-1's addressable RGB LED, whose driver (RMT) the firmware does not need
board_build.variant = nologo_esp32c3_super_mini
framework = arduino
lib_deps = 
    WiFi
    WifiClientSecure
    bblanchon/ArduinoJson@^7.3.0
    links2004/WebSockets@^2.6.1
    Wire
    SPI
    adafruit/Adafruit BusIO@^1.17.0
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the Arduino framework passes no optimization level for the code built here
    ; (firmware, Arduino core, libraries), so it was compiled without
    ; optimization (-O0); -Os makes firmware.bin about 360 KB smaller
    -Os
;    -D DEBUG_ESP_PORT=Serial
board_build.partitions = C3_partition_minimalSPIFFS.csv
upload_protocol = espota
upload_port = twitchdisplay.fritz.box
; ArduinoOTA password (= WEB_PASSWORD in include/secrets.h), taken from an
; environment variable so it never ends up in the repository
upload_flags = --auth=${sysenv.TWITCHDISPLAY_PASSWORD}

[env:twitchDisplay_apiTest]
build_src_filter = -<*> +<../examples/apiTest/>

[env:twitchDisplay_displayTest]
build_src_filter = -<*> +<../examples/displayTest/>

[env:twitchDisplay_ldrTest]
build_src_filter = -<*> +<../examples/ldrTest/>

[env:twitchDisplay]
; builds everything in src/
extra_scripts = pre:tools/version.py
