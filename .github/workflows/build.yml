# Builds the firmware on every push / pull request of the PlatformIO branch
# (only the main firmware; the test sketches in examples/ need secrets.h).
# Pushing a version tag (e.g. v1.0.0) also publishes a GitHub release with
# firmware.bin, which the display's "Online update" installs, and font.bin
# (fonts/font.bin, built by tools/make_fonts.py), which it downloads when its
# font partition lacks it.
# A manual run ("Run workflow", or the API) with a version (e.g. v1.0.1) on
# the PlatformIO branch tags its newest commit itself and publishes the
# release the same way, without pushing a tag by hand.
name: Build firmware

on:
  push:
    branches: [platform/platformio]
    tags: ['v*']
  pull_request:
    branches: [platform/platformio]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (vX.Y.Z): tags the newest commit and publishes the release; empty = build only'
        required: false
        type: string

permissions:
  contents: write # create releases for version tags

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the release to publish: a pushed version tag, or the version of a manual run
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for the version number (git describe)

      - name: Tag the release (manual run with a version)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        run: |
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "The version must look like v1.2.3"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/platform/platformio" ] || { echo "Releases are made from platform/platformio"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$RELEASE" >/dev/null; then echo "$RELEASE exists already"; exit 1; fi
          git tag "$RELEASE"
          git push origin "refs/tags/$RELEASE"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip                                    # PlatformIO and esptool downloads
          cache-dependency-path: .github/workflows/build.yml

      # toolchain and framework (not ~/.platformio/.cache: the downloaded archives, ~1 GB)
      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-packages-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      # build results and libraries of the last run: only changed files are compiled
      # (the version is in a generated header, see tools/version.py)
      - uses: actions/cache@v4
        with:
          path: |
            .pio/build
            .pio/libdeps
          key: pio-build-${{ runner.os }}-${{ hashFiles('platformio.ini', 'partitions.csv') }}-${{ github.sha }}
          restore-keys: pio-build-${{ runner.os }}-${{ hashFiles('platformio.ini', 'partitions.csv') }}-

      - name: Install PlatformIO and esptool
        run: pip install "platformio>=6.1,<7" "esptool>=5,<6"

      - name: Build firmware (no secrets, settings are entered on the device)
        run: |
          test ! -e include/secrets.h
          pio run -e twitchDisplay

      - name: Create merged image for the first flash over USB
        run: |
          B=.pio/build/twitchDisplay
          esptool --chip esp32c3 merge-bin -o $B/firmware-merged.bin --flash-mode dio --flash-size 4MB \
            0x0 $B/bootloader.bin \
            0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin \
            0x370000 fonts/font.bin

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            .pio/build/twitchDisplay/firmware.bin
            .pio/build/twitchDisplay/firmware-merged.bin
            .pio/build/twitchDisplay/firmware.elf
            fonts/font.bin

      - name: Check that the firmware version matches the tag
        if: env.RELEASE != ''
        run: test "$(git describe --always --tags --dirty)" = "$RELEASE"

      - name: Publish release
        if: env.RELEASE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE" \
            .pio/build/twitchDisplay/firmware.bin \
            .pio/build/twitchDisplay/firmware-merged.bin \
            .pio/build/twitchDisplay/firmware.elf \
            fonts/font.bin \
            --title "$RELEASE" --generate-notes --verify-tag
